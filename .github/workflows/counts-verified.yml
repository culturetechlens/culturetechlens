name: Counts verified

on:
  push:
    paths:
      - "knowledge-graph/**"
      - "counts.json"
      - "tools/verify_counts.py"
      - ".github/workflows/counts-verified.yml"
  pull_request:
    paths:
      - "knowledge-graph/**"
      - "counts.json"
      - "tools/verify_counts.py"
  workflow_dispatch:

jobs:
  verify-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute counts from the repository CSVs and compare with counts.json
        run: python3 tools/verify_counts.py
